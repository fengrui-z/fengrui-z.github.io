---
layout: compress
---

{% include head.html %}

<!-- Terminal-specific styles -->
<link rel="stylesheet" href="{{ site.baseurl }}/assets/terminal.css">

<style>
/* Homepage-specific overrides */
body {
    max-width: 820px;
    padding: 20px;
}

.site-header {
    margin-bottom: 20px;
}

/* Hide default header nav on homepage */
.home-layout .site-header nav {
    display: none;
}

/* Show simplified nav */
.home-layout .home-nav {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
    padding: 10px 0;
    border-top: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
}

.home-layout .home-nav a {
    color: var(--text-color);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s;
}

.home-layout .home-nav a:hover {
    color: var(--link-color);
}

/* Terminal footer */
.home-layout .terminal-footer {
    margin-top: 40px;
    padding: 20px 0;
    border-top: 1px solid var(--border-color);
    text-align: center;
    font-family: var(--font-monospace);
    color: var(--text-color);
    opacity: 0.6;
    font-size: 13px;
}
</style>

<body class="home-layout">

    {% include header.html %}

    <!-- Homepage Navigation -->
    <nav class="home-nav">
        <a href="{{ site.url }}/blog">📁 Blog</a>
        <a href="{{ site.url }}/life">📅 Life</a>
        <a href="https://github.com/fengrui-z" target="_blank">💻 GitHub ↗</a>
        <a href="https://scholar.google.com/citations?user=qv13JgoAAAAJ" target="_blank">📚 Scholar ↗</a>
    </nav>

    <!-- Terminal Container -->
    <div id="terminal-container"></div>

    <!-- Terminal Footer -->
    <div class="terminal-footer">
        <span>Last updated: 2026 | </span>
        <span>Built with Jekyll | </span>
        <a href="https://github.com/fengrui-z/fengrui-z.github.io" target="_blank" style="color: var(--link-color);">Source Code ↗</a>
    </div>

    {% include footer.html %}

    <!-- Terminal Script -->
    <script src="{{ site.baseurl }}/assets/terminal.js"></script>

</body>
</html>
