---
layout: compress

{% include head.html %}

<!-- Add class to existing body -->
<script>document.body.classList.add('home-layout');</script>

<!-- Terminal-specific styles -->
<link rel="stylesheet" href="{{ site.baseurl }}/assets/terminal.css">

<style>
/* Homepage-specific overrides - pure command line */
body.home-layout {
    max-width: 800px;
    padding: 40px 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Hide header completely */
.home-layout .site-header {
    display: none;
}

/* Hide footer */
.home-layout .bottom-footer {
    display: none;
}

/* Terminal container fills most of page */
#terminal-container {
    flex: 1;
}

/* Minimal footer */
.home-layout .terminal-footer {
    margin-top: 30px;
    text-align: center;
    font-family: var(--font-monospace);
    color: var(--text-color);
    opacity: 0.5;
    font-size: 12px;
}

.home-layout .terminal-footer a {
    color: var(--text-color);
    opacity: 0.7;
}
</style>

    <!-- Terminal Container -->
    <div id="terminal-container"></div>

    <!-- Minimal Footer -->
    <div class="terminal-footer">
        <a href="{{ site.url }}/blog">blog</a> ·
        <a href="{{ site.url }}/life">life</a> ·
        <a href="https://github.com/fengrui-z">github</a> ·
        <a href="https://scholar.google.com/citations?user=qv13JgoAAAAJ">scholar</a>
    </div>

    {% include footer.html %}

    <!-- Terminal Script -->
    <script src="{{ site.baseurl }}/assets/terminal.js"></script>

</body>
</html>
