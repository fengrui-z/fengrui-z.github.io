<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="shortcut icon" href="{{ site.baseurl }}/assets/favicon.ico" type="image/x-icon">
    <link rel="canonical" href="{{ site.baseurl }}{{ page.url }}">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/style.css">
    <style>
        .home-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .home-name {
            font-size: 2.5rem;
            font-weight: 600;
            color: #111;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .home-tagline {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .home-links {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .home-links a {
            color: #0066cc;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.15s ease;
        }

        .home-links a:hover {
            color: #004499;
        }
    </style>
</head>
<body class="home-layout">
    <main class="home-page">
        <h1 class="home-name">Fengrui Zhang</h1>
        <p class="home-tagline">First-year CS Ph.D. Student @ Nanjing University</p>
        <nav class="home-links">
            <a href="{{ site.url }}/blog">blog</a>
            <a href="{{ site.url }}/life">life</a>
            <a href="https://github.com/fengrui-z">github</a>
            <a href="https://scholar.google.com/citations?user=qv13JgoAAAAJ">scholar</a>
        </nav>
    </main>
</body>
</html>
